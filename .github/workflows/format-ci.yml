name: C/C++ Format CI

on:
  push:
    branches: [main, master]
    paths:
      - '.clang-format'
      - '**/*.c'
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/format-ci.yml'
  pull_request:
    paths:
      - '.clang-format'
      - '**/*.c'
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/format-ci.yml'

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned clang-format
        run: python -m pip install clang-format==19.1.2
      - name: Check Chromium formatting
        run: >-
          git ls-files -z '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' |
          xargs -0 -r clang-format --dry-run --Werror --style=file
